name: Import checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n bootstrap.sh
          sh -n install.sh
          sh -n root/usr/libexec/happ-forkop
      - name: Exercise importer in isolation
        run: python3 -m unittest discover -s tests -v
      - name: Verify and test pinned full hpwnr release
        run: |
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 120 -o "$RUNNER_TEMP/hpwnr" https://github.com/Omegaplexx/hpwnr/releases/download/v1.0.3/hpwnr-linux-x86_64
          printf '57e448bf9d2a3e6db09378943770f85006b0efb41ef7581e14f17e4eaf331486  %s\n' "$RUNNER_TEMP/hpwnr" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/hpwnr"
          HPWNR_BINARY="$RUNNER_TEMP/hpwnr" python3 -m unittest discover -s tests -p test_hpwnr_release.py -v
