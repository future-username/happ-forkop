name: Import checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n bootstrap.sh
          sh -n install.sh
          sh -n root/usr/libexec/happ-forkop
      - name: Exercise importer in isolation
        run: python3 -m unittest discover -s tests -v
